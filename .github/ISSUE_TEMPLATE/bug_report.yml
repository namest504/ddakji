name: 버그 신고
description: 동작이 기대와 다릅니다
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 무슨 일이 있었나요
      description: 기대한 동작과 실제 동작을 같이 적어주세요.
      placeholder: |
        기대: 모음집 창을 다른 노트 위에 놓으면 합쳐진다
        실제: 아무 일도 일어나지 않는다
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 재현 절차
      placeholder: |
        1. 노트 두 개를 만든다
        2. 한쪽을 다른 쪽 위로 끌어다 놓는다
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 앱 버전
      description: 노트 목록 → 설정 화면 맨 아래에 있습니다.
      placeholder: v0.1.3
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 운영체제
      placeholder: Windows 11 23H2

  - type: textarea
    id: extra
    attributes:
      label: 스크린샷·기타
      description: 화면과 관련된 문제라면 스크린샷이 큰 도움이 됩니다.
