name: 기능 제안
description: 이런 게 있으면 좋겠습니다
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 상황에서 불편한가요
      description: 해결책보다 **문제**를 먼저 적어주시면 더 나은 방법을 같이 찾을 수 있습니다.
      placeholder: 노트가 쌓이면 예전에 쓴 내용을 찾기 어렵다
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 생각하신 방법
      description: 없어도 괜찮습니다.

  - type: textarea
    id: alternatives
    attributes:
      label: 지금은 어떻게 하고 계신가요
      description: 우회 방법이 있다면 우선순위 판단에 도움이 됩니다.
