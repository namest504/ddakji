name: ci
on:
  pull_request:
  push:
    branches: [develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # 릴리스(태그) 빌드가 복원할 Windows 캐시를 기본 브랜치에 저장한다 —
  # GitHub 캐시는 같은 ref 또는 기본 브랜치 것만 복원 가능해서, 이 잡이 없으면
  # 태그 빌드는 매번 콜드 스타트로 의존성을 새로 받는다.
  windows-release-cache:
    if: github.ref == 'refs/heads/develop'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows-release
      # generate_context!(custom-protocol)가 frontendDist 존재를 요구한다 —
      # 의존성 캐시가 목적이므로 빈 dist로 충분 (앱 크레이트는 어차피 태그 빌드에서 재컴파일)
      - run: New-Item -ItemType Directory -Force -Path dist | Out-Null
      # tauri build와 동일한 피처로 컴파일해 아티팩트가 그대로 재사용되게 한다
      - run: cargo build --release --features custom-protocol --manifest-path src-tauri/Cargo.toml
