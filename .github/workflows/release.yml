name: release
on:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows-release
      # Tauri가 내려받는 NSIS 등 번들 도구 캐시
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-tools-windows
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ddakji ${{ github.ref_name }}"
          releaseDraft: true
          releaseBody: |
            See CHANGELOG below.

            **Portable (ddakji-*-portable-x64.zip)**
            - 설치 없이 압축 해제 후 ddakji.exe 실행 (WebView2 런타임 필요 — Windows 11 내장)
            - 노트 데이터는 %APPDATA%\com.ddakji.app 에 저장됩니다
            - exe 위치를 옮겼다면 트레이 "부팅 시 시작"을 껐다 켜서 경로를 갱신하세요
      - name: Package portable exe
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: Compress-Archive -Path src-tauri/target/release/ddakji.exe -DestinationPath "ddakji-$env:TAG-portable-x64.zip" -Force
      - name: Upload portable zip to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$env:TAG" "ddakji-$env:TAG-portable-x64.zip" --clobber
