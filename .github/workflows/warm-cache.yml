# 릴리스(태그) 빌드가 복원할 Windows 캐시를 기본 브랜치에 저장한다.
# GitHub 캐시는 같은 ref 또는 기본 브랜치 것만 복원 가능 — 이 워크플로가 없으면
# 태그 빌드는 매번 콜드 스타트로 의존성을 새로 받는다.
# Rust 쪽 변경이 있을 때만 실행 (Windows 러너 비용 절약).
name: warm-cache
on:
  push:
    branches: [develop]
    paths:
      - "src-tauri/**"
      - ".github/workflows/warm-cache.yml"
      - ".github/workflows/release.yml"

jobs:
  windows-release-cache:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows-release
      # generate_context!(custom-protocol)가 frontendDist 존재를 요구한다 —
      # 의존성 캐시가 목적이므로 빈 dist로 충분
      - run: New-Item -ItemType Directory -Force -Path dist | Out-Null
      # tauri build와 동일한 피처로 컴파일해 아티팩트가 그대로 재사용되게 한다
      - run: cargo build --release --features custom-protocol --manifest-path src-tauri/Cargo.toml
