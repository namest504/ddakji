<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 앱 아이콘 (#10): 오른쪽 아래 모서리가 말린 스티키 노트.
       tauri icon의 원본 — `npm run tauri icon app-icon.svg`로 icons/ 세트 재생성 -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE97A"/>
      <stop offset="1" stop-color="#FFC93C"/>
    </linearGradient>
    <linearGradient id="peel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2BE2B"/>
      <stop offset="1" stop-color="#D89E00"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- 종이: 오른쪽 아래 모서리는 말림을 위해 대각으로 잘려 있다 -->
  <path filter="url(#soft)" fill="url(#paper)"
    d="M196 64h632a132 132 0 0 1 132 132v500L692 960H196A132 132 0 0 1 64 828V196A132 132 0 0 1 196 64z"/>

  <!-- 말린 모서리: 종이 뒷면이 접혀 올라온 곡면 -->
  <path fill="url(#peel)"
    d="M960 696C948 830 830 948 696 960 780 892 892 780 960 696z"/>
  <path fill="#00000022"
    d="M960 696C948 830 830 948 696 960c96-40 224-168 264-264z"/>

  <!-- 메모 내용 암시: 두 줄의 잉크 라인 -->
  <rect x="240" y="326" width="516" height="58" rx="29" fill="#7A5800" opacity="0.30"/>
  <rect x="240" y="470" width="368" height="58" rx="29" fill="#7A5800" opacity="0.30"/>
</svg>
